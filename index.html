<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="slowmass is a private photo-sharing app."
    />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="slowmass" />
    <title>slowmass</title>
  </head>
  <body>
    <div id="root">
      <main class="welcome guest-shell startup-shell">
        <header class="masthead">
          <a class="site-name" href="/" aria-label="slowmass home">slowmass</a>
        </header>
        <section class="account-section" aria-label="Loading slowmass">
          <p role="status" data-startup-status>Starting slowmass…</p>
          <noscript>Enable JavaScript to use slowmass.</noscript>
        </section>
        <footer class="welcome-footer">
          <p>Share photos and organize events with friends.</p>
          <a href="/privacy/">Privacy</a>
        </footer>
      </main>
    </div>
    <script src="/startup.js" async></script>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
